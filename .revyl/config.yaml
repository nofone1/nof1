# Revyl CLI Configuration
# GitHub PR automation for nofone1/nof1 (Expo).
# Docs: https://docs.revyl.ai/cli/hot-reload

project:
    name: nof1-experiments
    org_id: f66dfe3c-1a0a-465e-a486-5c5a40179a49

defaults:
    open_browser: false
    timeout: 1800

pr_review:
    enabled: true
    skip_drafts: true
    path_filters: []
    label_filters: []
    actions:
        preview_link: true
        strict_build_checks: true
        proof_of_changes: true
        proof_harness:
            kind: cursor
            model_id: null
        checks: []
        system_prompt: ""
        workflows: []
    builds:
        ios:
            enabled: true
            framework: expo_ios
            app: e71fb604-d488-4d04-8cc4-81c81502f4b0
            root_dir: ./
            use_existing_ci: false
            # Local simulator build via prebuild + xcodebuild (no EAS / EXPO_TOKEN).
            build_command: |
                npm ci
                npx --yes expo prebuild --platform ios --non-interactive
                (cd ios && pod install)
                WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"; if [ -z "$WORKSPACE" ]; then echo "No xcworkspace found under ios"; exit 1; fi; SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c 'import json, sys; data=json.load(sys.stdin); print((data.get("workspace") or {}).get("schemes", [""])[0])')"; if [ -z "$SCHEME" ]; then echo "No scheme found in $WORKSPACE"; exit 1; fi; xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
            artifact_path: build/ios/Build/Products/Debug-iphonesimulator/*.app
            env: {}
            secrets: []
        # Android left off for staging dogfood (ios-only), matching bug-bazaar.
        # Re-enable when Android Expo preview builds are reliable on staging.
