project:
    id: 6210e6c4-38fa-5522-8480-7fc742f99c2c
session:
    idle_timeout_seconds: 1800
    before_script:
        script_path: ./scripts/prepare-test-session.sh
        timeout_seconds: 60
    auth_bypass:
        launch_vars:
            - REVYL_AUTH_BYPASS_ENABLED
            - REVYL_AUTH_BYPASS_TOKEN
        deep_link: nof1://revyl-auth?token=${REVYL_AUTH_BYPASS_TOKEN}&role=tester&redirect=%2F
build:
    framework: expo
    profiles:
        billing:
            ios:
                app_id: 92bd5b49-1cb9-4ceb-aec9-66094fd8a1e7
                build_commands:
                    - npm ci
                    - npx --yes expo prebuild --platform ios --non-interactive --clean
                    - (cd ios && pod install)
                    - WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"; if [ -z "$WORKSPACE" ]; then echo "No xcworkspace found under ios"; exit 1; fi; SCHEME="$(basename "$WORKSPACE" .xcworkspace)"; echo "Building signed-in billing workspace=$WORKSPACE scheme=$SCHEME configuration=Release"; xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-billing CODE_SIGNING_ALLOWED=NO build
                output_path: build/ios-billing/Build/Products/Release-iphonesimulator/*.app
                env:
                    EXPO_PUBLIC_SKIP_AUTH: "false"
                    NODE_ENV: production
                    REVYL_USE_FINGERPRINT: "1"
                secrets:
                    - EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
                    - EXPO_PUBLIC_CONVEX_URL
                    - EXPO_PUBLIC_REVENUECAT_TEST_API_KEY
            android:
                app_id: 91b8d0d3-423e-433b-90ee-21632bd9a71c
                build_commands:
                    - npm ci
                    - npx --yes expo prebuild --platform android --non-interactive --clean
                    - (cd android && GRADLE_USER_HOME="$PWD/../.gradle-home" ./gradlew assembleDebug -PreactNativeArchitectures=x86_64)
                output_path: android/app/build/outputs/apk/debug/*.apk
                env:
                    EXPO_PUBLIC_SKIP_AUTH: "false"
                    NODE_ENV: production
                    REVYL_USE_FINGERPRINT: "1"
                secrets:
                    - EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY
                    - EXPO_PUBLIC_CONVEX_URL
                    - EXPO_PUBLIC_REVENUECAT_TEST_API_KEY
        development:
            ios:
                app_id: 92bd5b49-1cb9-4ceb-aec9-66094fd8a1e7
                build_commands:
                    - npm ci
                    - npx --yes expo prebuild --platform ios --non-interactive --clean
                    - (cd ios && pod install)
                    - WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"; if [ -z "$WORKSPACE" ]; then echo "No xcworkspace found under ios"; exit 1; fi; SCHEME="$(basename "$WORKSPACE" .xcworkspace)"; echo "Building workspace=$WORKSPACE scheme=$SCHEME configuration=Release EXPO_PUBLIC_SKIP_AUTH=$EXPO_PUBLIC_SKIP_AUTH"; xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
                output_path: build/ios/Build/Products/Release-iphonesimulator/*.app
                env:
                    EXPO_PUBLIC_SKIP_AUTH: "true"
                    NODE_ENV: production
                    REVYL_USE_FINGERPRINT: "1"
            android:
                app_id: 91b8d0d3-423e-433b-90ee-21632bd9a71c
                build_commands:
                    - npm ci
                    - npx --yes expo prebuild --platform android --non-interactive --clean
                    - (cd android && GRADLE_USER_HOME="$PWD/../.gradle-home" ./gradlew assembleDebug -PreactNativeArchitectures=x86_64)
                output_path: android/app/build/outputs/apk/debug/*.apk
                env:
                    EXPO_PUBLIC_SKIP_AUTH: "true"
                    NODE_ENV: production
                    REVYL_USE_FINGERPRINT: "1"
        pr-review:
            ios:
                app_id: 92bd5b49-1cb9-4ceb-aec9-66094fd8a1e7
                build_commands:
                    - npm ci
                    - npx --yes expo prebuild --platform ios --non-interactive --clean
                    - (cd ios && pod install)
                    - WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"; if [ -z "$WORKSPACE" ]; then echo "No xcworkspace found under ios"; exit 1; fi; SCHEME="$(basename "$WORKSPACE" .xcworkspace)"; echo "Building workspace=$WORKSPACE scheme=$SCHEME configuration=Release EXPO_PUBLIC_SKIP_AUTH=$EXPO_PUBLIC_SKIP_AUTH"; xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
                output_path: build/ios/Build/Products/Release-iphonesimulator/*.app
                env:
                    EXPO_PUBLIC_SKIP_AUTH: "true"
                    NODE_ENV: production
                    REVYL_USE_FINGERPRINT: "1"
            android:
                app_id: 91b8d0d3-423e-433b-90ee-21632bd9a71c
                build_commands:
                    - npm ci
                    - npx --yes expo prebuild --platform android --non-interactive --clean
                    - (cd android && GRADLE_USER_HOME="$PWD/../.gradle-home" ./gradlew assembleDebug -PreactNativeArchitectures=x86_64)
                output_path: android/app/build/outputs/apk/debug/*.apk
                env:
                    EXPO_PUBLIC_SKIP_AUTH: "true"
                    NODE_ENV: production
                    REVYL_USE_FINGERPRINT: "1"
pr_review:
    enabled: true
    review_triggers:
        drafts: false
    build:
        kind: revyl
        profile: pr-review
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
    strict_ci_check:
        build: true
