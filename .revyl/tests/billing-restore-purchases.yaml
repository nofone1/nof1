# Deterministic because skip-auth builds configure RevenueCat with a throwaway
# customer per launch, so the pre-purchase restore always finds nothing.
test:
  metadata:
    name: billing-restore-purchases
    platform: ios
    tags:
      - billing
      - e2e
  build:
    name: ios
  blocks:
    - type: instructions
      step_description: "Open the Profile tab."
    - type: instructions
      step_description: "Open the Subscription row."
    - type: instructions
      step_description: "Tap 'Restore purchases'."
    - type: validation
      step_description: "An alert reports 'Nothing to restore'."
    - type: instructions
      step_description: "Dismiss the alert."
    - type: instructions
      step_description: "Tap 'Upgrade to Plus' and buy the monthly Nof1 Plus plan on the Test Store paywall."
    - type: instructions
      step_description: "Tap 'Restore purchases'."
    - type: validation
      step_description: "An alert reports 'Purchases restored' and the screen still shows 'Nof1 Plus' as active."
