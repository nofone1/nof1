test:
  metadata:
    name: billing-cancelled-purchase-stays-free
    platform: ios
    tags:
      - billing
      - e2e
  build:
    name: ios
  blocks:
    - type: instructions
      step_description: "Open the Profile tab."
    - type: instructions
      step_description: "Open the Subscription row."
    - type: instructions
      step_description: "Tap 'Upgrade to Plus'."
    - type: instructions
      step_description: "Dismiss the paywall without buying anything."
    - type: validation
      step_description: "The subscription screen still shows 'Free Plan' with a 'Free' badge."
    - type: validation
      step_description: "No access sources are listed and no management buttons are visible."
