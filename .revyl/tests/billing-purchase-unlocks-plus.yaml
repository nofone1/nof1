test:
  metadata:
    name: billing-purchase-unlocks-plus
    platform: ios
    tags:
      - billing
      - e2e
  build:
    name: ios
  blocks:
    - type: instructions
      step_description: "Open the Profile tab."
    - type: instructions
      step_description: "Open the Subscription row."
    - type: instructions
      step_description: "Tap 'Upgrade to Plus'."
    - type: instructions
      step_description: "Buy the monthly Nof1 Plus plan on the RevenueCat Test Store paywall."
    - type: validation
      step_description: "The subscription screen shows 'Nof1 Plus' with an 'Active' badge."
    - type: validation
      step_description: "The access sources list shows 'App Store' as an active source."
    - type: validation
      step_description: "A 'Manage App Store subscription' button is visible and no 'Manage Whop membership' button is visible."
