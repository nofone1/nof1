# Guards the isolation property that lets every dogfood run share one bypass
# identity: skip-auth access lives in process memory, and RevenueCat is
# configured with a throwaway customer per launch, so a Test Store purchase can
# never leak into the next Revyl run.
test:
  metadata:
    name: billing-relaunch-resets-dogfood-access
    platform: ios
    tags:
      - billing
      - e2e
  build:
    name: ios
  blocks:
    - type: instructions
      step_description: "Open the Profile tab."
    - type: instructions
      step_description: "Open the Subscription row."
    - type: instructions
      step_description: "Tap 'Upgrade to Plus' and buy the monthly Nof1 Plus plan on the Test Store paywall."
    - type: validation
      step_description: "The subscription screen shows 'Nof1 Plus' with an 'Active' badge."
    - type: manual
      action: kill_app
    - type: manual
      action: open_app
    - type: instructions
      step_description: "Open the Profile tab."
    - type: validation
      step_description: "The Subscription row shows the hint 'Free Plan' again."
